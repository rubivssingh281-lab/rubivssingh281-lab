<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="Core focus: Generative AI, Cybersecurity, AI/ML (beginner)">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#1fa2b0"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .card{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    .c2{animation-delay:.15s}.c3{animation-delay:.3s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .top{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s .5s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .item{opacity:0;animation:item .6s ease-out forwards}
    @keyframes item{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.6s 1.2s cubic-bezier(.2,.7,.2,1) forwards}
    .sweep{opacity:0;animation:sweep 4s 3s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-40px);opacity:0}25%{opacity:1}100%{transform:translateX(260px);opacity:0}}
    .soft{animation:soft 3.6s ease-in-out infinite}
    @keyframes soft{0%,100%{opacity:1}50%{opacity:.45}}
  </style>

  <!-- ===== 01 · GENERATIVE AI ===== -->
  <g class="card">
    <g transform="translate(10 10)">
      <rect width="310" height="330" rx="12" fill="#0e181b" stroke="#1b2a2e"/>
      <rect class="top" x="1" y="0" width="308" height="2" rx="1" fill="url(#accent)"/>

      <rect x="24" y="26" width="44" height="44" rx="10" fill="#0a1114" stroke="#1b2a2e"/>
      <g transform="translate(46 48)" fill="none" stroke="#1fa2b0" stroke-width="1.6" stroke-linejoin="round">
        <path d="M0-12C1.5-4 4-1.5 12 0C4 1.5 1.5 4 0 12C-1.5 4-4 1.5-12 0C-4-1.5-1.5-4 0-12Z"/>
        <circle class="soft" cx="10" cy="-10" r="2" fill="#a3e635" stroke="none"/>
      </g>

      <text class="mono" x="286" y="40" text-anchor="end" font-size="12" fill="#3a4d53">01</text>
      <text class="sans" x="84" y="47" font-size="20" font-weight="600" fill="#e5eef0">Generative AI</text>
      <text class="mono" x="84" y="66" font-size="10.5" fill="#1fa2b0" letter-spacing="1.5">APPLIED · BUILDING</text>
      <line x1="24" y1="96" x2="286" y2="96" stroke="#1b2a2e"/>

      <g class="sans" font-size="14" fill="#b8c7cb">
        <g class="item" style="animation-delay:.7s"><rect x="24" y="126" width="8" height="2" fill="#1fa2b0"/><text x="42" y="132">Prompt engineering &amp; LLMs</text></g>
        <g class="item" style="animation-delay:.85s"><rect x="24" y="162" width="8" height="2" fill="#1fa2b0"/><text x="42" y="168">Gemini API · Vertex AI</text></g>
        <g class="item" style="animation-delay:1s"><rect x="24" y="198" width="8" height="2" fill="#1fa2b0"/><text x="42" y="204">Agentic AI development</text></g>
        <g class="item" style="animation-delay:1.15s"><rect x="24" y="234" width="8" height="2" fill="#1fa2b0"/><text x="42" y="240">NLP &amp; speech recognition</text></g>
      </g>

      <text class="mono" x="24" y="288" font-size="10.5" fill="#5b6e74" letter-spacing="1.5">PROFICIENCY</text>
      <text class="mono" x="286" y="288" text-anchor="end" font-size="10.5" fill="#a3e635" letter-spacing="1.5">INTERMEDIATE</text>
      <rect x="24" y="298" width="262" height="4" rx="2" fill="#1b2a2e"/>
      <rect class="bar" x="24" y="298" width="178" height="4" rx="2" fill="url(#accent)"/>
      <rect class="sweep" x="24" y="298" width="40" height="4" rx="2" fill="url(#shine)"/>
    </g>
  </g>

  <!-- ===== 02 · CYBERSECURITY ===== -->
  <g class="card c2">
    <g transform="translate(345 10)">
      <rect width="310" height="330" rx="12" fill="#0e181b" stroke="#1b2a2e"/>
      <rect class="top" x="1" y="0" width="308" height="2" rx="1" fill="url(#accent)" style="animation-delay:.65s"/>

      <rect x="24" y="26" width="44" height="44" rx="10" fill="#0a1114" stroke="#1b2a2e"/>
      <g transform="translate(46 48)">
        <path d="M0-13L11-8.5V0C11 7 6 11 0 13.5C-6 11-11 7-11 0V-8.5Z" fill="none" stroke="#1fa2b0" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M-4.5 .5L-1 4L5-3" fill="none" stroke="#a3e635" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-10" y="0" width="20" height="1" fill="#1fa2b0" opacity=".6">
          <animate attributeName="y" values="-11;11;-11" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text class="mono" x="286" y="40" text-anchor="end" font-size="12" fill="#3a4d53">02</text>
      <text class="sans" x="84" y="47" font-size="20" font-weight="600" fill="#e5eef0">Cybersecurity</text>
      <text class="mono" x="84" y="66" font-size="10.5" fill="#1fa2b0" letter-spacing="1.5">HANDS-ON · INTERNSHIP</text>
      <line x1="24" y1="96" x2="286" y2="96" stroke="#1b2a2e"/>

      <g class="sans" font-size="14" fill="#b8c7cb">
        <g class="item" style="animation-delay:.85s"><rect x="24" y="126" width="8" height="2" fill="#1fa2b0"/><text x="42" y="132">Pentesting · Metasploit &amp; Burp</text></g>
        <g class="item" style="animation-delay:1s"><rect x="24" y="162" width="8" height="2" fill="#1fa2b0"/><text x="42" y="168">Recon · Nmap, Wireshark</text></g>
        <g class="item" style="animation-delay:1.15s"><rect x="24" y="198" width="8" height="2" fill="#1fa2b0"/><text x="42" y="204">Threat detection &amp; response</text></g>
        <g class="item" style="animation-delay:1.3s"><rect x="24" y="234" width="8" height="2" fill="#1fa2b0"/><text x="42" y="240">Secure coding · XSS, SQLi, CSRF</text></g>
      </g>

      <text class="mono" x="24" y="288" font-size="10.5" fill="#5b6e74" letter-spacing="1.5">PROFICIENCY</text>
      <text class="mono" x="286" y="288" text-anchor="end" font-size="10.5" fill="#a3e635" letter-spacing="1.5">INTERMEDIATE</text>
      <rect x="24" y="298" width="262" height="4" rx="2" fill="#1b2a2e"/>
      <rect class="bar" x="24" y="298" width="190" height="4" rx="2" fill="url(#accent)" style="animation-delay:1.35s"/>
      <rect class="sweep" x="24" y="298" width="40" height="4" rx="2" fill="url(#shine)" style="animation-delay:4.3s"/>
    </g>
  </g>

  <!-- ===== 03 · AI / ML ===== -->
  <g class="card c3">
    <g transform="translate(680 10)">
      <rect width="310" height="330" rx="12" fill="#0e181b" stroke="#1b2a2e"/>
      <rect class="top" x="1" y="0" width="308" height="2" rx="1" fill="url(#accent)" style="animation-delay:.8s"/>

      <rect x="24" y="26" width="44" height="44" rx="10" fill="#0a1114" stroke="#1b2a2e"/>
      <g transform="translate(46 48)">
        <path d="M-10-7L0-10M-10-7L0 0M-10-7L0 10M-10 7L0-10M-10 7L0 0M-10 7L0 10M0-10L10 0M0 0L10 0M0 10L10 0" fill="none" stroke="#1fa2b0" stroke-width="1" stroke-opacity=".6"/>
        <g fill="#0a1114" stroke="#1fa2b0" stroke-width="1.3">
          <circle cx="-10" cy="-7" r="2.4"/><circle cx="-10" cy="7" r="2.4"/>
          <circle cx="0" cy="-10" r="2.4"/><circle cx="0" cy="0" r="2.4"/><circle cx="0" cy="10" r="2.4"/>
        </g>
        <circle class="soft" cx="10" cy="0" r="2.8" fill="#a3e635"/>
      </g>

      <text class="mono" x="286" y="40" text-anchor="end" font-size="12" fill="#3a4d53">03</text>
      <text class="sans" x="84" y="47" font-size="20" font-weight="600" fill="#e5eef0">AI / ML</text>
      <text class="mono" x="84" y="66" font-size="10.5" fill="#1fa2b0" letter-spacing="1.5">FOUNDATIONS · LEARNING</text>
      <line x1="24" y1="96" x2="286" y2="96" stroke="#1b2a2e"/>

      <g class="sans" font-size="14" fill="#b8c7cb">
        <g class="item" style="animation-delay:1s"><rect x="24" y="126" width="8" height="2" fill="#1fa2b0"/><text x="42" y="132">Python · PyTorch basics</text></g>
        <g class="item" style="animation-delay:1.15s"><rect x="24" y="162" width="8" height="2" fill="#1fa2b0"/><text x="42" y="168">CNN embeddings &amp; retrieval</text></g>
        <g class="item" style="animation-delay:1.3s"><rect x="24" y="198" width="8" height="2" fill="#1fa2b0"/><text x="42" y="204">Segmentation &amp; object detection</text></g>
        <g class="item" style="animation-delay:1.45s"><rect x="24" y="234" width="8" height="2" fill="#1fa2b0"/><text x="42" y="240">ML fundamentals, in progress</text></g>
      </g>

      <text class="mono" x="24" y="288" font-size="10.5" fill="#5b6e74" letter-spacing="1.5">PROFICIENCY</text>
      <text class="mono" x="286" y="288" text-anchor="end" font-size="10.5" fill="#a3e635" letter-spacing="1.5">BEGINNER</text>
      <rect x="24" y="298" width="262" height="4" rx="2" fill="#1b2a2e"/>
      <rect class="bar" x="24" y="298" width="92" height="4" rx="2" fill="url(#accent)" style="animation-delay:1.5s"/>
      <rect class="sweep" x="24" y="298" width="40" height="4" rx="2" fill="url(#shine)" style="animation-delay:5.6s"/>
    </g>
  </g>
</svg>
