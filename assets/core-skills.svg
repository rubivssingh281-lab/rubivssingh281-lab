<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Core skills: Generative AI, Cybersecurity, AI/ML (beginner)">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .card{animation:float 6s ease-in-out infinite}
    .c2{animation-delay:-2s}.c3{animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .run{animation:run 5s linear infinite}
    .c2 .run{animation-delay:-1.6s}.c3 .run{animation-delay:-3.3s}
    @keyframes run{to{stroke-dashoffset:-100}}
    .item{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .bar{transform:scaleX(0);transform-box:fill-box;transform-origin:left;animation:fill 1.8s 1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fill{to{transform:scaleX(1)}}
    .sweep{animation:sweep 3s 2.8s ease-in-out infinite;opacity:0}
    @keyframes sweep{0%{transform:translateX(-60px);opacity:0}20%{opacity:1}100%{transform:translateX(260px);opacity:0}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <!-- ============ GEN-AI ============ -->
  <g class="card">
    <g transform="translate(10 20)">
      <rect width="310" height="340" rx="16" fill="#0f1426" stroke="#a78bfa" stroke-opacity=".25"/>
      <rect class="run" width="310" height="340" rx="16" fill="none" stroke="#a78bfa" stroke-width="2" pathLength="100" stroke-dasharray="14 86" filter="url(#glow)"/>

      <circle cx="50" cy="60" r="27" fill="#a78bfa" fill-opacity=".14"/>
      <g transform="translate(50 60)"><path class="spin" d="M0-15C2-5 5-2 15 0C5 2 2 5 0 15C-2 5-5 2-15 0C-5-2-2-5 0-15Z" fill="#c4b5fd" filter="url(#glow)"/></g>
      <circle class="pulse" cx="64" cy="44" r="3" fill="#ede9fe"/>

      <text class="sans" x="92" y="56" font-size="21" font-weight="700" fill="#f1f5f9">Generative AI</text>
      <rect x="92" y="67" width="128" height="20" rx="10" fill="#a78bfa" fill-opacity=".16"/>
      <text class="mono" x="156" y="81" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c4b5fd" letter-spacing="1">BUILDING WITH IT</text>

      <g class="sans" font-size="14.5" fill="#cbd5e1">
        <g class="item" style="animation-delay:.3s"><circle cx="32" cy="135" r="3.5" fill="#a78bfa"/><text x="46" y="140">Prompt engineering &amp; LLMs</text></g>
        <g class="item" style="animation-delay:.5s"><circle cx="32" cy="173" r="3.5" fill="#a78bfa"/><text x="46" y="178">Gemini API · Vertex AI</text></g>
        <g class="item" style="animation-delay:.7s"><circle cx="32" cy="211" r="3.5" fill="#a78bfa"/><text x="46" y="216">Agentic AI development</text></g>
        <g class="item" style="animation-delay:.9s"><circle cx="32" cy="249" r="3.5" fill="#a78bfa"/><text x="46" y="254">NLP &amp; speech recognition</text></g>
      </g>

      <text class="mono" x="26" y="298" font-size="11" fill="#64748b" letter-spacing="1">LEVEL · INTERMEDIATE</text>
      <rect x="26" y="308" width="258" height="6" rx="3" fill="#ffffff" fill-opacity=".07"/>
      <rect class="bar" x="26" y="308" width="175" height="6" rx="3" fill="#a78bfa"/>
      <rect class="sweep" x="26" y="308" width="50" height="6" rx="3" fill="url(#shine)"/>
    </g>
  </g>

  <!-- ============ CYBERSECURITY ============ -->
  <g class="card c2">
    <g transform="translate(345 20)">
      <rect width="310" height="340" rx="16" fill="#0d1a1a" stroke="#34d399" stroke-opacity=".25"/>
      <rect class="run" width="310" height="340" rx="16" fill="none" stroke="#34d399" stroke-width="2" pathLength="100" stroke-dasharray="14 86" filter="url(#glow)"/>

      <circle cx="50" cy="60" r="27" fill="#34d399" fill-opacity=".14"/>
      <g transform="translate(50 60)" filter="url(#glow)">
        <path d="M0-16L13-10V0C13 8 7 13 0 16C-7 13-13 8-13 0V-10Z" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M-5 0L-1 4L6-4" fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1">
          <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;.3;.8;1" dur="3s" repeatCount="indefinite"/>
        </path>
        <rect x="-15" y="-1" width="30" height="1.5" fill="#a7f3d0" opacity=".7">
          <animate attributeName="y" values="-15;14;-15" dur="2.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text class="sans" x="92" y="56" font-size="21" font-weight="700" fill="#f1f5f9">Cybersecurity</text>
      <rect x="92" y="67" width="140" height="20" rx="10" fill="#34d399" fill-opacity=".16"/>
      <text class="mono" x="162" y="81" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6ee7b7" letter-spacing="1">HANDS-ON · INTERN</text>

      <g class="sans" font-size="14.5" fill="#cbd5e1">
        <g class="item" style="animation-delay:.5s"><circle cx="32" cy="135" r="3.5" fill="#34d399"/><text x="46" y="140">Pentesting · Metasploit, Burp</text></g>
        <g class="item" style="animation-delay:.7s"><circle cx="32" cy="173" r="3.5" fill="#34d399"/><text x="46" y="178">Recon · Nmap, Wireshark</text></g>
        <g class="item" style="animation-delay:.9s"><circle cx="32" cy="211" r="3.5" fill="#34d399"/><text x="46" y="216">Threat detection &amp; response</text></g>
        <g class="item" style="animation-delay:1.1s"><circle cx="32" cy="249" r="3.5" fill="#34d399"/><text x="46" y="254">Secure coding · XSS, SQLi, CSRF</text></g>
      </g>

      <text class="mono" x="26" y="298" font-size="11" fill="#64748b" letter-spacing="1">LEVEL · INTERMEDIATE</text>
      <rect x="26" y="308" width="258" height="6" rx="3" fill="#ffffff" fill-opacity=".07"/>
      <rect class="bar" x="26" y="308" width="190" height="6" rx="3" fill="#34d399"/>
      <rect class="sweep" x="26" y="308" width="50" height="6" rx="3" fill="url(#shine)"/>
    </g>
  </g>

  <!-- ============ AI / ML ============ -->
  <g class="card c3">
    <g transform="translate(680 20)">
      <rect width="310" height="340" rx="16" fill="#1a160c" stroke="#fbbf24" stroke-opacity=".25"/>
      <rect class="run" width="310" height="340" rx="16" fill="none" stroke="#fbbf24" stroke-width="2" pathLength="100" stroke-dasharray="14 86" filter="url(#glow)"/>

      <circle cx="50" cy="60" r="27" fill="#fbbf24" fill-opacity=".14"/>
      <g transform="translate(50 60)" stroke="#fcd34d" stroke-width="1.2" stroke-opacity=".6">
        <path d="M-12-9L0-12M-12-9L0 0M-12-9L0 12M-12 9L0-12M-12 9L0 0M-12 9L0 12M0-12L12 0M0 0L12 0M0 12L12 0" fill="none"/>
        <g stroke="none">
          <circle class="pulse" cx="-12" cy="-9" r="3" fill="#fcd34d"/>
          <circle class="pulse" cx="-12" cy="9" r="3" fill="#fcd34d" style="animation-delay:-.4s"/>
          <circle class="pulse" cx="0" cy="-12" r="3" fill="#fde68a" style="animation-delay:-.8s"/>
          <circle class="pulse" cx="0" cy="0" r="3" fill="#fde68a" style="animation-delay:-1.2s"/>
          <circle class="pulse" cx="0" cy="12" r="3" fill="#fde68a" style="animation-delay:-1.6s"/>
          <circle class="pulse" cx="12" cy="0" r="3.4" fill="#fbbf24" style="animation-delay:-2s"/>
        </g>
      </g>

      <text class="sans" x="92" y="56" font-size="21" font-weight="700" fill="#f1f5f9">AI / ML</text>
      <rect x="92" y="67" width="156" height="20" rx="10" fill="#fbbf24" fill-opacity=".16"/>
      <text class="mono" x="170" y="81" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fcd34d" letter-spacing="1">BEGINNER · LEARNING</text>

      <g class="sans" font-size="14.5" fill="#cbd5e1">
        <g class="item" style="animation-delay:.7s"><circle cx="32" cy="135" r="3.5" fill="#fbbf24"/><text x="46" y="140">Python · PyTorch basics</text></g>
        <g class="item" style="animation-delay:.9s"><circle cx="32" cy="173" r="3.5" fill="#fbbf24"/><text x="46" y="178">CNN embeddings (GeoSat)</text></g>
        <g class="item" style="animation-delay:1.1s"><circle cx="32" cy="211" r="3.5" fill="#fbbf24"/><text x="46" y="216">Segmentation &amp; detection</text></g>
        <g class="item" style="animation-delay:1.3s"><circle cx="32" cy="249" r="3.5" fill="#fbbf24"/><text x="46" y="254">Learning ML fundamentals</text></g>
      </g>

      <text class="mono" x="26" y="298" font-size="11" fill="#64748b" letter-spacing="1">LEVEL · BEGINNER</text>
      <rect x="26" y="308" width="258" height="6" rx="3" fill="#ffffff" fill-opacity=".07"/>
      <rect class="bar" x="26" y="308" width="90" height="6" rx="3" fill="#fbbf24"/>
      <rect class="sweep" x="26" y="308" width="50" height="6" rx="3" fill="url(#shine)"/>
    </g>
  </g>
</svg>
