<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Saksham Singh — Generative AI, Cybersecurity, AI/ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .blob{animation:drift 14s ease-in-out infinite alternate}
    .b2{animation-duration:18s;animation-delay:-6s}
    .b3{animation-duration:16s;animation-delay:-3s}
    @keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(60px,-25px)}100%{transform:translate(-40px,20px)}}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .role{opacity:0;animation:role 9s ease-in-out infinite}
    .r2{animation-delay:3s}.r3{animation-delay:6s}
    @keyframes role{0%{opacity:0;transform:translateY(12px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-12px)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .p{animation:up linear infinite;opacity:0}
    @keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-220px);opacity:0}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- drifting colour blobs -->
    <g filter="url(#blur)" opacity=".55">
      <circle class="blob" cx="180" cy="60" r="110" fill="#7c3aed"/>
      <circle class="blob b2" cx="620" cy="250" r="120" fill="#0891b2"/>
      <circle class="blob b3" cx="900" cy="40" r="90" fill="#059669"/>
    </g>

    <!-- rising particles -->
    <g fill="#e2e8f0">
      <circle class="p" cx="80"  cy="290" r="1.6" style="animation-duration:9s;animation-delay:0s"/>
      <circle class="p" cx="170" cy="290" r="1.2" style="animation-duration:12s;animation-delay:-4s"/>
      <circle class="p" cx="260" cy="290" r="2"   style="animation-duration:10s;animation-delay:-7s"/>
      <circle class="p" cx="340" cy="290" r="1.3" style="animation-duration:13s;animation-delay:-2s"/>
      <circle class="p" cx="430" cy="290" r="1.7" style="animation-duration:11s;animation-delay:-9s"/>
      <circle class="p" cx="510" cy="290" r="1.1" style="animation-duration:8s;animation-delay:-5s"/>
      <circle class="p" cx="590" cy="290" r="1.8" style="animation-duration:12s;animation-delay:-1s"/>
      <circle class="p" cx="680" cy="290" r="1.2" style="animation-duration:10s;animation-delay:-6s"/>
      <circle class="p" cx="760" cy="290" r="1.5" style="animation-duration:14s;animation-delay:-3s"/>
      <circle class="p" cx="850" cy="290" r="1.3" style="animation-duration:9s;animation-delay:-8s"/>
      <circle class="p" cx="940" cy="290" r="1.9" style="animation-duration:11s;animation-delay:-4s"/>
    </g>

    <!-- text -->
    <text class="sans mono rise d1" x="62" y="78" font-size="15" fill="#22d3ee" letter-spacing="3">HI THERE, I'M</text>
    <text class="sans rise d2" x="58" y="138" font-size="58" font-weight="800" fill="url(#name)">Saksham Singh</text>

    <g class="mono" font-size="23">
      <text x="62" y="186" fill="#64748b">&gt;</text>
      <text class="role" x="86" y="186" fill="#c4b5fd">Generative AI builder</text>
      <text class="role r2" x="86" y="186" fill="#6ee7b7">Cybersecurity enthusiast</text>
      <text class="role r3" x="86" y="186" fill="#fcd34d">AI/ML learner (beginner)</text>
    </g>

    <text class="sans rise d3" x="62" y="230" font-size="15" fill="#94a3b8">B.Tech CSE (Data Science) · ABES Institute of Technology · SIH 2025</text>

    <!-- orbit emblem -->
    <g transform="translate(830 140)">
      <circle r="92" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-dasharray="3 6"/>
      <circle r="64" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
      <circle r="36" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="2 4"/>
      <circle r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="r" values="14;18;14" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text class="mono" y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#22d3ee">&lt;/&gt;</text>

      <g filter="url(#glow)">
        <g><circle cx="92" r="7" fill="#a78bfa"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></g>
        <g><circle cx="-64" r="6" fill="#34d399"/>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/></g>
        <g><circle cy="-36" r="5" fill="#fbbf24"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="279" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
