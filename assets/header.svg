<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Saksham Singh — Generative AI, Cybersecurity, AI/ML">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1fa2b0" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1000" height="260" fill="url(#fade)"/></mask>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#1fa2b0"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.9s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .rule{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:draw 1.2s .5s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes draw{to{transform:scaleX(1)}}
    .role{opacity:0;animation:role 12s ease-in-out infinite}
    .r2{animation-delay:4s}.r3{animation-delay:8s}
    @keyframes role{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-6px)}}
    .dot{animation:dot 2.4s ease-in-out infinite}
    @keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
    .node{animation:node 4s ease-in-out infinite}
    @keyframes node{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.35}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#0a1114"/>
    <rect width="1000" height="260" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- left: identity -->
    <text class="mono rise d1" x="60" y="74" font-size="13" fill="#1fa2b0" letter-spacing="2.5">B.TECH CSE · DATA SCIENCE</text>
    <text class="sans rise d2" x="57" y="128" font-size="50" font-weight="700" fill="#e5eef0" letter-spacing="-.5">Saksham Singh</text>
    <rect class="rule" x="60" y="146" width="84" height="2" rx="1" fill="url(#rule)"/>

    <g class="sans" font-size="19">
      <text class="role" x="60" y="184" fill="#b8c7cb"><tspan fill="#1fa2b0" font-weight="600">Generative AI</tspan><tspan fill="#5b6e74">  ·  </tspan>LLMs, prompting &amp; agentic apps</text>
      <text class="role r2" x="60" y="184" fill="#b8c7cb"><tspan fill="#1fa2b0" font-weight="600">Cybersecurity</tspan><tspan fill="#5b6e74">  ·  </tspan>pentesting, recon &amp; secure code</text>
      <text class="role r3" x="60" y="184" fill="#b8c7cb"><tspan fill="#1fa2b0" font-weight="600">AI / ML</tspan><tspan fill="#5b6e74">  ·  </tspan>building foundations (beginner)</text>
    </g>

    <g class="rise d3">
      <circle class="dot" cx="64" cy="215" r="3.5" fill="#a3e635"/>
      <text class="sans" x="76" y="220" font-size="14" fill="#8a9da3">ABES Institute of Technology, Ghaziabad·</text>
    </g>

    <!-- right: network motif -->
    <g transform="translate(680 30)">
      <g stroke="#1fa2b0" stroke-opacity=".22" stroke-width="1" fill="none">
        <path d="M40 40L150 22L250 68M40 40L84 128L190 118L150 22M250 68L190 118L272 168L250 68M84 128L34 196L142 200L84 128M190 118L142 200L232 212L272 168"/>
      </g>

      <!-- travelling signals -->
      <g filter="url(#glow)">
        <circle r="2.6" fill="#a3e635">
          <animateMotion dur="7s" repeatCount="indefinite" path="M40 40L150 22L190 118L142 200L232 212" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="7s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.2" fill="#5fd3de">
          <animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M34 196L84 128L190 118L272 168L250 68"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="8s" begin="-3s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g fill="#0a1114" stroke="#1fa2b0" stroke-width="1.3">
        <circle class="node" cx="40"  cy="40"  r="4"/>
        <circle class="node" cx="150" cy="22"  r="4" style="animation-delay:-1s"/>
        <circle class="node" cx="250" cy="68"  r="4" style="animation-delay:-2s"/>
        <circle class="node" cx="84"  cy="128" r="4" style="animation-delay:-3s"/>
        <circle class="node" cx="272" cy="168" r="4" style="animation-delay:-1.5s"/>
        <circle class="node" cx="34"  cy="196" r="4" style="animation-delay:-2.5s"/>
        <circle class="node" cx="142" cy="200" r="4" style="animation-delay:-.5s"/>
        <circle class="node" cx="232" cy="212" r="4" style="animation-delay:-3.5s"/>
      </g>
      <!-- hub -->
      <circle cx="190" cy="118" r="14" fill="none" stroke="#1fa2b0" stroke-opacity=".35">
        <animate attributeName="r" values="8;20" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".5;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="118" r="6.5" fill="#0e3f45" stroke="#1fa2b0" stroke-width="1.5"/>
      <circle cx="190" cy="118" r="2.2" fill="#a3e635"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="259" rx="14" fill="none" stroke="#1b2a2e"/>
</svg>
