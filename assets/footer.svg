<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#1fa2b0" stop-opacity="0"/>
      <stop offset=".6" stop-color="#1fa2b0"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <clipPath id="line"><rect x="0" y="20" width="1000" height="4"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
    .beam{animation:beam 6s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes beam{from{transform:translateX(-180px)}to{transform:translateX(1000px)}}
  </style>
  <rect x="0" y="21" width="1000" height="1" fill="#1b2a2e"/>
  <g clip-path="url(#line)"><rect class="beam" x="0" y="21" width="180" height="1.5" fill="url(#beam)"/></g>
  <text class="sans" x="500" y="60" text-anchor="middle" font-size="15" fill="#8a9da3">Thanks for visiting. Feel free to reach out.</text>
  <text class="mono" x="500" y="82" text-anchor="middle" font-size="11" fill="#3a4d53" letter-spacing="2">SAKSHAM SINGH</text>
</svg>
